# Aborting the parent turn while a tool is in flight: the tool dies with a
# tool.error (code aborted), the turn ends turn.failed (code aborted), and
# NOTHING runs after — the final event is the turn failure. A hanging tool
# plus an abort at the tool.call event is the deterministic recipe.
name: abort-propagation
description: >
  Aborting mid-tool: tool.error aborted, turn.failed aborted, no events
  after the failure.
kind: loop
setup:
  provider_script:
    - tool_call: { name: long_job, call_id: l1, input: { seconds: 30 } }
  tools:
    - name: long_job
      risk: R0
      hang_ms: 30000
  abort_after_event: tool.call
  policy:
    - { id: allow-r0, match: { risk: R0 }, decision: allow }
input:
  user_message: "run the long job"
assertions:
  - { assert: event_present, event: tool.call }
  - { assert: event_present, event: turn.failed }
  - { assert: event_field, event: turn.failed, field: error, contains: abort }
  - { assert: final_event, event: turn.failed }
